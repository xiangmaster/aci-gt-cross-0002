name: GT-0225 challenge producer
on:
  issues:
    types: [opened]
permissions:
  contents: read
  actions: read
  models: read
jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: agent
        uses: google-github-actions/run-gemini-cli@v0.1.16
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: ${{ github.event.issue.body }}
          settings: '{"tools":{"allowed":["write_file"]}}'
      - name: Materialize agent result
        run: |
          printf '%s\n' "${{ steps.agent.outputs.result }}" > agent-result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: agent-result
          path: agent-result.txt
